[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "picowave"
version = "0.1.0"
description = "Host tooling for the pico_logic_gen RP2040 waveform generator"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[project.scripts]
picowave = "picowave.cli:main"

[tool.setuptools.packages.find]
include = ["picowave*"]
